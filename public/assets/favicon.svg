<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="crt-ambient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#A8D672" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="0"/>
    </radialGradient>
    <filter id="phosphor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#A8D672" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- CRT Monitor Bezel & Ambient Screen Backing -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#0B0E14" stroke="#1F293D" stroke-width="1.5"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5" fill="url(#crt-ambient)"/>

  <!-- Subtle CRT Phosphor Scanlines -->
  <line x1="3" y1="8" x2="29" y2="8" stroke="#A8D672" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="3" y1="12" x2="29" y2="12" stroke="#A8D672" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="3" y1="16" x2="29" y2="16" stroke="#A8D672" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="3" y1="20" x2="29" y2="20" stroke="#A8D672" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="3" y1="24" x2="29" y2="24" stroke="#A8D672" stroke-opacity="0.08" stroke-width="1"/>

  <!-- 8-Bit Pixel Art "H" with Phosphor Glow -->
  <g fill="#A8D672" filter="url(#phosphor)">
    <!-- Left Vertical Pillar -->
    <rect x="7" y="6" width="4" height="20" rx="0.5"/>
    <!-- Right Vertical Pillar -->
    <rect x="21" y="6" width="4" height="20" rx="0.5"/>
    <!-- Center Crossbar -->
    <rect x="11" y="14" width="10" height="4" rx="0.5"/>

    <!-- Pixel Serif Corner Brackets -->
    <rect x="5" y="6" width="2" height="2" rx="0.3"/>
    <rect x="25" y="6" width="2" height="2" rx="0.3"/>
    <rect x="5" y="24" width="2" height="2" rx="0.3"/>
    <rect x="25" y="24" width="2" height="2" rx="0.3"/>
  </g>

  <!-- High-Intensity Phosphor Core -->
  <g fill="#E6FFBA" opacity="0.95">
    <rect x="8" y="7" width="2" height="18"/>
    <rect x="22" y="7" width="2" height="18"/>
    <rect x="10" y="15" width="12" height="2"/>
  </g>
</svg>